<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Remove On Edge</title>
  </head>
  <body>
    <main class="page">
      <img src="/images/cat-no-bg.png" alt="" class="cat" />
      <section class="card">
        <header class="header">
          <h1>Background Removal - On Edge</h1>
          <p class="subtitle">Upload an image, choose quality mode &amp; download final .png image.</p>
        </header>

        <section class="top-layout">
          <div class="controls">
            <label class="field">
              <span>Upload image</span>
              <input id="imageInput" type="file" accept="image/*" />
            </label>

            <div class="quality-group">
              <p class="quality-label">Quality mode</p>
              <input id="qualityMode" type="hidden" value="balanced" />
              <div class="quality-options" role="group" aria-label="Quality mode">
                <button
                  type="button"
                  class="quality-option is-selected"
                  data-mode="balanced"
                  aria-pressed="true"
                >
                  Balanced (faster, downscales very large images)
                </button>
                <button
                  type="button"
                  class="quality-option"
                  data-mode="max"
                  aria-pressed="false"
                >
                  Max quality (full resolution)
                </button>
              </div>
            </div>
          </div>

          <div class="preview-column">
            <article class="preview-card">
              <h2>Image Preview</h2>
              <div class="preview-stage">
                <img id="originalPreview" alt="" />
                <p class="preview-placeholder">Upload an image to see the preview.</p>
              </div>
            </article>

            <section class="middle-layout">
              <button id="removeBtn" type="button">Remove Background</button>
              <p id="status" data-state="idle" aria-live="polite"></p>
            </section>
          </div>
        </section>

        <section class="bottom-layout">
          <article class="preview-card result-preview-card">
            <h2>Final Image Preview</h2>
            <div class="preview-stage">
              <img id="resultPreview" alt="Background removed preview" />
              <p class="preview-placeholder">Click on "remove background" to see the result.</p>
            </div>
          </article>

          <div class="download-panel">
            <button id="downloadBtn" type="button" disabled>Download Image</button>
            <p id="downloadStatus" aria-live="polite"></p>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
